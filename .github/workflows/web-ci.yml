name: Web CI

# Web 工作台的发布门禁。main/develop 上涉及 Web 或发布配置的改动必须通过
# 测试、类型检查和生产构建；是否设为 required check 由仓库分支保护控制。
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'web/**'
      - 'system/release.config.json'
      - 'scripts/system/release.mjs'
  push:
    branches: [main, develop]
    paths:
      - 'web/**'
      - 'system/release.config.json'
      - 'scripts/system/release.mjs'

permissions:
  contents: read

jobs:
  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
